<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <!-- product card -->
    <div class="bg-white shadow rounded-lg p-4 m-4 mx-auto w-110  hover:shadow-lg transition-shadow">
        <!-- product image -->
        <div class="flex justify-center mb-4">
            <img src="https://static.nike.com/a/images/t_default/f7065c34-5e45-45ac-9ca6-a9eba20581ca/NIKE+AIR+MAX+1.png" alt="Nike Shoes">
        </div>

        <!-- product info -->
        <div class="flex flex-col space-y-2">
            <h1 class="font-bold">Nike Air Max</h1>
            <!-- price and rating -->
            <div class="flex justify-between items-center">
                <!-- price -->
                <span class="text-xl font-bold">$99.99</span>
                <!-- rating -->
                <div class="flex items-center">
                    <span class="text-yellow-400 ml-1">★★★★☆</span>
                    <span class="text-sm text-gray-600 ml-1">(4.2)</span>
                </div>

            </div>

            <!-- option colors -->
            <div class="flex space-x-2 pb-2">
                <div class="bg-red-500 w-6 h-6 rounded-full"></div>
                <div class="bg-blue-500 w-6 h-6 rounded-full"></div>
                <div class="bg-black w-6 h-6 rounded-full"></div>
            </div>

            <!-- add to cart button -->
            
            <button class="bg-rose-500 text-white font-medium rounded-lg p-2 hover:bg-rose-600 cursor-pointer">Add to Cart</button>
     
        </div> 

    </div>
    
</body>
</html>
