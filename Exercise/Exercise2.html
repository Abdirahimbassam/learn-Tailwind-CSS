<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <!-- grid exercise -->
    <div class="grid grid-cols-3 my-24 px-48">
        <div class="bg-blue-500 rounded-lg text-white tex-medium m-4 p-4 col-span-3">
           <h1>Featured Content</h1>
           <p>This spans all three columns</p>
        </div>

        <div class="bg-green-500 rounded-lg text-white tex-medium m-4 p-4 col-span-2">
            <h1>Left Section</h1>
            <p>Takes up to 2 Columns</p>
        </div>

        <div class="bg-green-500 rounded-lg text-white tex-medium m-4 p-4">
            <h1>Rigth Section</h1>
            <p>Takes 1 column</p>
        </div>

        <div class="bg-purple-500 rounded-lg text-white tex-medium m-4 p-4">
            <h1>Column 1</h1>
            <p>Equal Width</p>
        </div>

        <div class="bg-purple-500 rounded-lg text-white tex-medium m-4 p-4">
            <h1>Column 2</h1>
            <p>Equal Width</p>
        </div>

        <div class="bg-purple-500 rounded-lg text-white tex-medium m-4 p-4">
            <h1>Column 3</h1>
            <p>Equal Width</p>
        </div>
    
    </div>

   

</body>
</html>
